# Deploys to the VPS on every push to main (reuses deploy/push.sh).
#
# One-time setup:
#  1. On your machine, make a deploy keypair:
#       ssh-keygen -t ed25519 -f deploy_key -N "" -C "github-actions"
#  2. On the VPS, allow it:
#       cat deploy_key.pub >> /root/.ssh/authorized_keys
#  3. In the repo: Settings -> Secrets and variables -> Actions -> New secret
#       DEPLOY_SSH_KEY   = contents of the private `deploy_key` file
#       DEPLOY_HOST      = 147.189.172.101
#       DEPLOY_USER      = root
#  4. Delete deploy_key / deploy_key.pub locally.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host deploy\n  HostName %s\n  User %s\n  ServerAliveInterval 30\n' \
            "${{ secrets.DEPLOY_HOST }}" "${{ secrets.DEPLOY_USER }}" >> ~/.ssh/config

      - name: Deploy
        run: bash deploy/push.sh
        env:
          VPS: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
