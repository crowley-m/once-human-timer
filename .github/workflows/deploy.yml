# Deploys to the VPS on every push to main (reuses deploy/push.sh).
#
# One-time setup (run on the VPS — it's simplest there):
#   ssh-keygen -t ed25519 -f ~/deploy_key -N "" -C "github-actions"
#   cat ~/deploy_key.pub >> ~/.ssh/authorized_keys
#   cat ~/deploy_key          # paste the whole output into the DEPLOY_SSH_KEY secret
#   rm ~/deploy_key ~/deploy_key.pub
#
# Then add repo secrets (Settings -> Secrets and variables -> Actions):
#   DEPLOY_SSH_KEY  = the private key printed above (-----BEGIN ... END-----)
#   DEPLOY_HOST     = 147.189.172.101
#   DEPLOY_USER     = root
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ]; then
            echo "::error::Set the DEPLOY_SSH_KEY, DEPLOY_HOST and DEPLOY_USER repo secrets first."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          {
            echo "Host *"
            echo "  StrictHostKeyChecking accept-new"
            echo "  ServerAliveInterval 30"
          } >> ~/.ssh/config

      - name: Deploy
        env:
          VPS: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: bash deploy/push.sh
